<!doctype html>
<html lang="cs" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two earbuds · CMF Buds Pro 2 vs. Galaxy Buds Live</title>
    <meta
      name="description"
      content="Interaktivní průvodce dvěma způsoby poslechu hudby: CMF Buds Pro 2 a Samsung Galaxy Buds Live. Rozdíly, zvuk, funkce a doporučení podle toho, jak posloucháš."
    />
    <meta name="color-scheme" content="dark light" />
    <!-- Fonty podle nothing-design skillu: Space Grotesk (UI), Space Mono (data/labely), Doto (jen hero). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap&subset=latin-ext"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/app.css" />
    <script>
      // Téma nastavíme před prvním vykreslením, ať nebliká.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
